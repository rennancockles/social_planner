[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "social-planner"
version = "0.1.0"
description = "Social media post planner with AI-generated suggestions"
authors = [
    {name = "Rennan Cockles", email = "r3ck.dev@gmail.com"},
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlmodel>=0.0.22",
    "anthropic>=0.49",
    "openai>=1.58",
    "python-dotenv>=1.0",
    "pydantic-settings>=2.7",
    "httpx2>=2.13",
    "pillow>=11.0",
]

[dependency-groups]
dev = [
    "ruff>=0.16",
    "mypy>=2.3",
    "ty>=0.0.75",
    "pytest>=9.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "pytest-rerunfailures>=16.6",
    "pytest-xdist>=3.8.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]


[tool.ruff]
line-length = 100
indent-width = 4
respect-gitignore = true
target-version = "py313"

[tool.ruff.lint]
select = [
    "C",  # McCabe complexity
    "E",  # pycodestyle
    "W",  # pycodestyle warnings
    "F",  # Pyflakes
    "I",  # isort
    "UP",  # pyupgrade
    "PL",  # Pylint
    "B",  # flake8-bugbear
    "ASYNC",  # flake8-async
    "SIM",  # flake8-simplify
    "N",  # pep8-naming
]
ignore = ["B008"]  # FastAPI depends injection pattern

fixable = ["ALL"]

# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # Imported but unused

[tool.ruff.lint.pylint]
max-args = 8

[tool.ruff.lint.flake8-quotes]
docstring-quotes = "double"

[tool.ruff.lint.isort]
combine-as-imports = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"


[tool.mypy]
python_version = "3.13"
strict = true
packages = ["app"]
cache_fine_grained = true
ignore_missing_imports = true
disallow_untyped_defs = true
check_untyped_defs = true
warn_return_any = true
warn_unreachable = true
plugins = [
    "pydantic.mypy",
]


[tool.ty.src]
include = ["app"]

[tool.ty.rules]
unused-ignore-comment = "ignore"
no-matching-overload = "ignore"
unused-type-ignore-comment = "ignore"

[tool.ty.environment]
python-version = "3.13"

[tool.ty.terminal]
output-format = "concise"


[tool.pytest.ini_options]
addopts = "-rfEs --strict-config --strict-markers -n auto --no-header"
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = [
    "tests",
]
markers = [
    "unit: mark a test as a unit test",
    "integration: mark a test as an integration test"
]


[tool.coverage.run]
source = ["app"]

[tool.coverage.report]
fail_under = 75
