server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Wizard uploads (images/audio) can be large.
    client_max_body_size 200m;

    # No trailing slash on proxy_pass: the backend routes already carry the /api and
    # /media prefixes, so the path is forwarded unchanged.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # AI generation and video export can take a while.
        proxy_read_timeout 300s;
    }

    location /media/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
